[build]
  command = "pnpm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/gemini/token"
  to = "/.netlify/functions/gemini-token"
  status = 200

[[redirects]]
  from = "/api/gemini/status"
  to = "/.netlify/functions/gemini-status"
  status = 200

[[redirects]]
  from = "/api/gemini/models"
  to = "/.netlify/functions/gemini-models"
  status = 200

[[redirects]]
  from = "/api/gemini/query"
  to = "/.netlify/functions/gemini-query"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
