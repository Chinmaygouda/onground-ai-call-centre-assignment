[build]
  command = "pnpm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_LIVE_MODEL,GEMINI_TEXT_MODEL,AI_DEFAULT_LANGUAGE,AI_MAX_RESPONSE_TOKENS,AI_TEMPERATURE,AI_AGENT,EXOTEL_SUBDOMAIN,BUSINESS_DATA_MODE,TWILIO_PHONE_NUMBER,TWILIO_ALLOWLIST_REQUIRED,TWILIO_ALLOWED_TO_NUMBERS,TWILIO_TEST_TO_NUMBER,TWILIO_TRIAL_MODE,TWILIO_ENABLE_LIVE_CALLS,TWILIO_WEBHOOK_BASE_URL,EXOTEL_REGION,VITE_AGENT_NAME,VITE_ENABLE_GEMINI_LIVE,VITE_GEMINI_MODEL,TWILIO_AI_TURN_WEBHOOK_PATH,TWILIO_STATUS_WEBHOOK_PATH,TWILIO_VOICE_WEBHOOK_PATH,TWILIO_MAX_CALL_DURATION_SECONDS,TWILIO_MAX_CONVERSATION_TURNS,TWILIO_VALIDATE_WEBHOOK_SIGNATURE,TWILIO_FROM_NUMBER"

[[redirects]]
  from = "/api/gemini/token"
  to = "/.netlify/functions/gemini-token"
  status = 200

[[redirects]]
  from = "/api/gemini/status"
  to = "/.netlify/functions/gemini-status"
  status = 200

[[redirects]]
  from = "/api/gemini/models"
  to = "/.netlify/functions/gemini-models"
  status = 200

[[redirects]]
  from = "/api/gemini/query"
  to = "/.netlify/functions/gemini-query"
  status = 200

[[redirects]]
  from = "/api/exotel/call"
  to = "/.netlify/functions/exotel-call"
  status = 200

[[redirects]]
  from = "/api/exotel/call-status"
  to = "/.netlify/functions/exotel-status"
  status = 200

[[redirects]]
  from = "/api/exotel/callback"
  to = "/.netlify/functions/exotel-callback"
  status = 200

[[redirects]]
  from = "/api/twilio/call"
  to = "/.netlify/functions/twilio-call"
  status = 200

[[redirects]]
  from = "/api/twilio/end-call"
  to = "/.netlify/functions/twilio-end-call"
  status = 200

[[redirects]]
  from = "/api/twilio/call-status"
  to = "/.netlify/functions/twilio-status"
  status = 200

[[redirects]]
  from = "/api/twilio/voice"
  to = "/.netlify/functions/twilio-voice"
  status = 200

[[redirects]]
  from = "/api/twilio/ai-turn"
  to = "/.netlify/functions/twilio-ai-turn"
  status = 200

[[redirects]]
  from = "/api/twilio/status"
  to = "/.netlify/functions/twilio-status"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
